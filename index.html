    function ScrollableTableWrapper({ children }) {
      const scrollRef = useRef(null);
      const [showLeft, setShowLeft] = useState(false);
      const [showRight, setShowRight] = useState(false);

      const checkScroll = () => {
        if (scrollRef.current) {
          const { scrollLeft, scrollWidth, clientWidth } = scrollRef.current;
          setShowLeft(scrollLeft > 0);
          setShowRight(scrollLeft < scrollWidth - clientWidth - 1);
        }
      };

      useEffect(() => {
        checkScroll();
        const timer = setTimeout(checkScroll, 100);
        window.addEventListener('resize', checkScroll);
        return () => {
           window.removeEventListener('resize', checkScroll);
           clearTimeout(timer);
        };
      }, [children]);

        if (scrollRef.current) {
          const scrollAmount = direction === 'left' ? -350 : 350;
          scrollRef.current.scrollBy({ left: scrollAmount, behavior: 'smooth' });
          setTimeout(checkScroll, 350);
        }
      };

      return (
        <div className="relative group">

            <button 
              onClick={() => scroll('left')}
              className="absolute left-0 top-1/2 -translate-y-1/2 z-50 bg-white/90 shadow-md border border-slate-200 p-1.5 rounded-r-xl hover:bg-indigo-50 text-indigo-600 focus:outline-none backdrop-blur-sm opacity-80 hover:opacity-100 transition-all"

            const data = doc.data();
            loadedUsers.push(data);
            if (data.id === 'c1' || data.name === 'Alan Hennis') hasAlan = true;
          });

          if (snapshot.empty) {
            INITIAL_USERS.forEach(u => setDoc(doc(db, 'users', u.id), u));
          } else {
            if (!hasAlan) {
              const alan = { id: 'c1', name: 'Alan Hennis', role: 'Customer' };
              setDoc(doc(db, 'users', 'c1'), alan);
            }
            setUsers(loadedUsers);
          }
        });

        const projectsRef = collection(db, 'projects');
        const unsubProjects = onSnapshot(projectsRef, (snapshot) => {
          const loadedProjects = [];
          snapshot.forEach(doc => loadedProjects.push(doc.data()));
          if (snapshot.empty) INITIAL_PROJECTS.forEach(p => setDoc(doc(db, 'projects', p.id), p));
          else {
            setProjects(loadedProjects);
            setIsDataLoaded(true);
          }
        });

        const historyRef = collection(db, 'history');

          const loadedHistory = [];
          snapshot.forEach(doc => loadedHistory.push(doc.data()));
          loadedHistory.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
          setHistoryLogs(loadedHistory);
        });

        return () => { unsubUsers(); unsubProjects(); unsubHistory(); };
      }, [firebaseUser]);

        if (!newStaffName.trim()) return;
        const newUser = { id: `s${Date.now()}`, name: newStaffName, role: 'Staff' };
        if (db) await setDoc(doc(db, 'users', newUser.id), newUser);
        else setUsers([...users, newUser]);
        setNewStaffName('');
      };

      const handleUpdateRole = async (userId, newRole) => {
        if (db) {
            const existing = users.find(u => u.id === userId);
            await setDoc(doc(db, 'users', userId), { ...existing, role: newRole });
        } else setUsers(users.map(u => u.id === userId ? { ...u, role: newRole } : u));
        
        if (currentUser && currentUser.id === userId) setCurrentUser(prev => ({ ...prev, role: newRole }));
      };

        if (db) await deleteDoc(doc(db, 'users', userId));
        else setUsers(users.filter(u => u.id !== userId));
        
        if (currentUser && currentUser.id === userId) {
          setCurrentUser(null);

        }

        const existing = projects.find(p => p.id === jobId);

        const originalSiteName = existing?.siteName;
        const newSiteName = updatedData.siteName;
        const siteNameChanged = originalSiteName && originalSiteName.trim() !== '' && newSiteName && originalSiteName !== newSiteName;

        // Diffing phases for hours changes
        const newLogs = [];
        if (existing && updatedData.phases) {
          Object.keys(updatedData.phases).forEach(phaseName => {
            const oldHours = parseFloat(existing.phases[phaseName]?.hoursSpent || 0);
            const newHours = parseFloat(updatedData.phases[phaseName]?.hoursSpent || 0);
            
            if (oldHours !== newHours) {
              newLogs.push({
                id: `h${Date.now()}${Math.random().toString(36).substr(2, 5)}`,
                jobId: existing.id,
                jobName: updatedData.jobName || existing.jobName,
                phaseName: phaseName,
                oldHours: oldHours,
                newHours: newHours,
                userId: currentUser.id,
                userName: currentUser.name,
                timestamp: new Date().toISOString()
              });
            }
          });
        }

        let nextProjects = projects.map(p => {
          if (p.id === jobId) return { ...p, ...updatedData };
          if (siteNameChanged && p.siteName === originalSiteName) return { ...p, siteName: newSiteName };
          return p;
        });

        if (db) {
            const jobsToUpdate = [{ id: jobId, data: { ...existing, ...updatedData } }];
            if (siteNameChanged) {
              projects.forEach(p => {
                if (p.id !== jobId && p.siteName === originalSiteName) {
                  jobsToUpdate.push({ id: p.id, data: { ...p, siteName: newSiteName } });
                }
              });
            }
            
            for (const item of jobsToUpdate) {

            }
            for (const log of newLogs) {
               await setDoc(doc(db, 'history', log.id), log);
            }
        } else {
            setProjects(nextProjects);
            setHistoryLogs(prev => [...newLogs, ...prev].sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp)));
        }

        setSelectedJob(null);
      };

                  <div>

                                </button>
                              </div>
                            </div>
                          )
                        })
                      )}
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}

          {showManageSitesModal && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden flex flex-col max-h-[80vh] border border-gray-100">
                <div className="px-6 py-5 border-b flex justify-between items-center bg-gradient-to-r from-slate-50 to-white">

                    <MapPin className="w-6 h-6 text-indigo-600" />
                    Manage Sites
                  </h2>
                  <button onClick={() => { setShowManageSitesModal(false); setSiteToDelete(null); }} className="p-2 hover:bg-rose-50 text-slate-400 hover:text-rose-500 rounded-full transition-colors">

                  <div className="space-y-2">
                    {existingSites.length === 0 ? (
                      <div className="text-center py-8 bg-white rounded-xl border border-dashed border-gray-300">
                        <p className="text-sm text-slate-500">No sites found.</p>
                      </div>
                    ) : (
                      existingSites.map(site => {
                        const count = projects.filter(p => p.siteName === site).length;
                        return (
                          <div key={site} className="flex justify-between items-center bg-white p-3 rounded-xl border border-gray-100 shadow-sm hover:border-indigo-100 transition-colors">
                            <div className="flex flex-col">

                              <span className="text-[10px] text-slate-400 font-medium">Đang dùng trong {count} job</span>

    // --- MANAGER DASHBOARD ---
    function ManagerDashboard({ currentUser, users, projects, setProjects, historyLogs, db, onJobClick, existingSites }) {
      const [activeTab, setActiveTab] = useState('list');
      
      const [newJob, setNewJob] = useState({ 
        siteName: '', jobName: '', ref: '', receivedDate: '', startedDate: '', ownerId: '', dueDate: '', buildingType: '', status: [], priority: 'Medium' 
      });

      const handleCreateJob = async (e) => {
        e.preventDefault();
        if (!newJob.jobName.trim()) return;
        
        const project = {
          id: `p${Date.now()}`,
          ...newJob,
          phases: generateInitialPhases()
        };
        
        if (db) await setDoc(doc(db, 'projects', project.id), project);
        else setProjects([...projects, project]);

        setNewJob({ siteName: '', jobName: '', ref: '', receivedDate: '', startedDate: '', ownerId: '', dueDate: '', buildingType: '', status: [], priority: 'Medium' });
        setActiveTab('list');
      };

      const handleExport = () => {
        const excelData = projects.map(p => {
          const owner = users.find(u => u.id === p.ownerId)?.name || 'Unassigned';
          const pPriority = extractPriority(p);
          const pStatuses = extractStatuses(p);

          const preDesignHrs = parseFloat(p.phases['Pre-Design']?.hoursSpent || 0);
          const wallPanelsHrs = parseFloat(p.phases['DFM - Wall Panels']?.hoursSpent || 0);
          const floorCassetteHrs = parseFloat(p.phases['DFM - Floor Cassette']?.hoursSpent || 0);
          const roofPanelsHrs = parseFloat(p.phases['DFM - Roof Panels']?.hoursSpent || 0);
          const lookoutsHrs = parseFloat(p.phases['DFM - Lookouts']?.hoursSpent || 0);
          const totalDfmHrs = wallPanelsHrs + floorCassetteHrs + roofPanelsHrs + lookoutsHrs;
          const updatesHrs = Object.keys(p.phases)
            .filter(phase => !PHASES.includes(phase))
            .reduce((sum, phase) => sum + parseFloat(p.phases[phase]?.hoursSpent || 0), 0);

          const row = {
            'Site Name': p.siteName || '',
            'Ref': p.ref || '',
            'Job Name': p.jobName || '',
            'Building Type': p.buildingType || '',
            'Priority': pPriority,
            'Status': pStatuses.join(', '),
            'Owner': owner,
            'Received Date': formatDate(p.receivedDate),
            'Started Date': formatDate(p.startedDate),
            'Due Date': formatDate(p.dueDate),
            
            'Pre-Design - Progress': p.phases['Pre-Design']?.progress || '',
            'Pre-Design - Hrs': p.phases['Pre-Design']?.hoursSpent || 0,
            'Pre-Design - Date Sent': formatDate(p.phases['Pre-Design']?.dateSent),
            
            'Wall Panels - Progress': p.phases['DFM - Wall Panels']?.progress || '',
            'Wall Panels - Hrs': p.phases['DFM - Wall Panels']?.hoursSpent || 0,
            'Wall Panels - Date Sent': formatDate(p.phases['DFM - Wall Panels']?.dateSent),
            
            'Floor Cassette - Progress': p.phases['DFM - Floor Cassette']?.progress || '',
            'Floor Cassette - Hrs': p.phases['DFM - Floor Cassette']?.hoursSpent || 0,
            'Floor Cassette - Date Sent': formatDate(p.phases['DFM - Floor Cassette']?.dateSent),
            
            'Roof Panels - Progress': p.phases['DFM - Roof Panels']?.progress || '',
            'Roof Panels - Hrs': p.phases['DFM - Roof Panels']?.hoursSpent || 0,
            'Roof Panels - Date Sent': formatDate(p.phases['DFM - Roof Panels']?.dateSent),
            
            'Lookouts - Progress': p.phases['DFM - Lookouts']?.progress || '',
            'Lookouts - Hrs': p.phases['DFM - Lookouts']?.hoursSpent || 0,
            'Lookouts - Date Sent': formatDate(p.phases['DFM - Lookouts']?.dateSent),

            'Total Pre-Design Hrs': preDesignHrs,
            'Total DFM Hrs': totalDfmHrs,
            'Total Updates/Corrections Hrs': updatesHrs,
            'OVERALL TOTAL HRS': preDesignHrs + totalDfmHrs + updatesHrs
          };

          Object.keys(p.phases).forEach(phaseName => {
            if (!PHASES.includes(phaseName)) {
              row[`${phaseName} - Progress`] = p.phases[phaseName]?.progress || '';
              row[`${phaseName} - Hrs`] = p.phases[phaseName]?.hoursSpent || 0;
              row[`${phaseName} - Date Sent`] = formatDate(p.phases[phaseName]?.dateSent);
            }
          });

          return row;
        });

        const worksheet = XLSX.utils.json_to_sheet(excelData);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "ProjectTracker");
        XLSX.writeFile(workbook, "WorkTracker_ProjectTracker.xlsx");
      };

      const staffUsers = users.filter(u => u.role === 'Staff');

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div className="flex flex-wrap items-center justify-between border-b border-slate-100 bg-gradient-to-r from-slate-50 to-white pr-6">
            <div className="flex overflow-x-auto hide-scrollbar">
              <button 
                onClick={() => setActiveTab('list')}
                className={`px-6 py-5 flex items-center gap-2 font-bold transition-all border-b-2 whitespace-nowrap ${activeTab === 'list' ? 'border-indigo-600 text-indigo-700 bg-white' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}
              >
                <ListTodo className="w-5 h-5" />
                Job List
              </button>
              <button 
                onClick={() => setActiveTab('stats')}
                className={`px-6 py-5 flex items-center gap-2 font-bold transition-all border-b-2 whitespace-nowrap ${activeTab === 'stats' ? 'border-indigo-600 text-indigo-700 bg-white' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}
              >
                <BarChart2 className="w-5 h-5" />
                Statistics
              </button>
              <button 
                onClick={() => setActiveTab('history')}
                className={`px-6 py-5 flex items-center gap-2 font-bold transition-all border-b-2 whitespace-nowrap ${activeTab === 'history' ? 'border-indigo-600 text-indigo-700 bg-white' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}
              >
                <Clock className="w-5 h-5" />
                History
              </button>
              <button 
                onClick={() => setActiveTab('progress')}
                className={`px-6 py-5 flex items-center gap-2 font-bold transition-all border-b-2 whitespace-nowrap ${activeTab === 'progress' ? 'border-indigo-600 text-indigo-700 bg-white' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}
              >
                <Activity className="w-5 h-5" />
                Progress
              </button>
              {currentUser.role !== 'Customer' && (
                <button 
                  onClick={() => setActiveTab('add')}
                  className={`px-6 py-5 flex items-center gap-2 font-bold transition-all border-b-2 whitespace-nowrap ${activeTab === 'add' ? 'border-indigo-600 text-indigo-700 bg-white' : 'border-transparent text-slate-500 hover:bg-slate-100'}`}
                >
                  <FilePlus className="w-5 h-5" />
                  Add New Job
                </button>
              )}
            </div>
            <div className="flex items-center gap-4 py-2">
              <div className="text-sm font-bold text-slate-400 hidden md:block">Total Jobs: {projects.length}</div>
              <button 
                onClick={handleExport}
                className="flex items-center gap-2 bg-emerald-100 text-emerald-700 hover:bg-emerald-200 px-4 py-2 rounded-xl transition-colors text-sm font-bold shadow-sm"
              >
                <Download className="w-4 h-4" />
                Export Report
              </button>
            </div>
          </div>
          
          <div className="p-6 bg-slate-50/30 min-h-[500px]">
            {activeTab === 'add' && (
              <form onSubmit={handleCreateJob} className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 max-w-4xl mx-auto">
                <h3 className="text-lg font-extrabold text-slate-800 mb-6 flex items-center gap-2 border-b pb-4">
                  <Plus className="w-5 h-5 text-indigo-500" />
                  Job Details
                </h3>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                  <div className="flex flex-col gap-1 lg:col-span-1">
                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">Site Name *</label>
                    <input type="text" required list="site-names-add" value={newJob.siteName} onChange={e => setNewJob({...newJob, siteName: e.target.value})} className="px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50 focus:bg-white transition-colors" />
                    <datalist id="site-names-add">
                      {existingSites && existingSites.map(site => <option key={site} value={site} />)}
                    </datalist>
                  </div>

                  <div className="flex flex-col gap-1 lg:col-span-2">
                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">Job Name *</label>
                    <input type="text" required value={newJob.jobName} onChange={e => setNewJob({...newJob, jobName: e.target.value})} className="px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50 focus:bg-white transition-colors" />
                  </div>
                  
                  <div className="flex flex-col gap-1">
                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">Ref</label>
                    <input type="text" value={newJob.ref} onChange={e => setNewJob({...newJob, ref: e.target.value})} className="px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50 focus:bg-white transition-colors" />
                  </div>

                  <div className="flex flex-col gap-1">

                  <div className="flex flex-col gap-1">

                  <div className="flex flex-col gap-1">

                    <select value={newJob.ownerId} onChange={e => setNewJob({...newJob, ownerId: e.target.value})} className="px-4 py-2.5 border border-slate-200 rounded-xl text-sm focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50 focus:bg-white transition-colors">

                  <div className="flex flex-col gap-1">
                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">Building Type *</label>

                  <div className="flex flex-col gap-1">
                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">Priority</label>

                      {PRIORITIES.map(st => <option key={st} value={st}>{st}</option>)}
                    </select>
                  </div>

                  <div className="flex flex-col gap-1 lg:col-span-3">
                    <label className="text-xs font-bold text-slate-500 uppercase tracking-wider">Status (Max 3)</label>

                          const currentStatuses = Array.isArray(newJob.status) ? newJob.status : (newJob.status ? [newJob.status] : []);
                          const isSelected = currentStatuses.includes(st);
                          const isDisabled = !isSelected && currentStatuses.length >= 3;
                          return (
                              <button
                                  type="button"
                                  key={st}
                                  onClick={() => {
                                      if (isSelected) setNewJob({...newJob, status: currentStatuses.filter(s => s !== st)});
                                      else if (!isDisabled) setNewJob({...newJob, status: [...currentStatuses, st]});
                                  }}
                                  disabled={isDisabled}
                                  className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition-colors ${isSelected ? STATUS_STYLES[st] : 'bg-slate-50 text-slate-500 border-slate-200 hover:bg-slate-100'} ${isDisabled ? 'opacity-50 cursor-not-allowed' : 'cursor-pointer'}`}

                  <div className="lg:col-span-3 flex justify-end mt-4 pt-4 border-t border-slate-100">

                    <button type="submit" className="bg-gradient-to-r from-indigo-600 to-cyan-500 text-white px-8 py-3 rounded-xl hover:from-indigo-700 hover:to-cyan-600 shadow-md transition-all flex items-center gap-2 text-sm font-bold">

    function StatisticsView({ projects, users }) {
      const [viewMode, setViewMode] = useState('count'); // 'count', 'average', 'total', 'productivity'
      const [buildingFilter, setBuildingFilter] = useState('Overall');
      const [reportType, setReportType] = useState('task-type');

      const statsData = useMemo(() => {
        const stats = {};
        const allMonths = new Set();
        const rowKeysSet = new Set();

        const filteredProjects = buildingFilter === 'Overall' 
            ? projects 
            : projects.filter(p => p.buildingType === buildingFilter);

        filteredProjects.forEach(p => {
          const isVariationJob = p.jobName && p.jobName.toLowerCase().includes('variation');
          const designerName = users.find(u => u.id === p.ownerId)?.name || 'Unassigned';

          Object.entries(p.phases || {}).forEach(([phaseName, phaseData]) => {
            if (phaseData.dateSent) {
              const month = phaseData.dateSent.substring(0, 7);
              allMonths.add(month);

              let category = null;
              if (isVariationJob) {
                category = 'Variation';
              } else {
                const pName = phaseName.toLowerCase();
                if (pName.includes('correction')) category = 'Correction';
                else if (pName.includes('update')) category = 'Update';
                else if (pName.includes('pre-design')) category = 'Pre-Design';
                else if (pName.includes('wall panels')) category = 'Wall Panels';
                else if (pName.includes('floor cassette')) category = 'Floor Cassette';
                else if (pName.includes('roof panels')) category = 'Roof Panels';
                else if (pName.includes('lookouts')) category = 'Lookouts';
              }

              if (category) {
                let rowKey = '';
                if (reportType === 'task-type') rowKey = category;
                else if (reportType === 'designer') rowKey = designerName;
                else if (reportType === 'designer-task') rowKey = `${designerName} - ${category}`;

                rowKeysSet.add(rowKey);

                if (!stats[month]) stats[month] = {};
                if (!stats[month][rowKey]) stats[month][rowKey] = { count: 0, hours: 0, expectedHours: 0, addedExpected: new Set(), jobs: [] };

                stats[month][rowKey].count += 1;
                stats[month][rowKey].hours += parseFloat(phaseData.hoursSpent || 0);
                if (!stats[month][rowKey].jobs.includes(p.jobName)) {
                    stats[month][rowKey].jobs.push(p.jobName);
                }

                // Lưu số giờ expected chỉ một lần mỗi job/category để tránh bị nhân đôi (khi job có nhiều phase Update cùng loại)
                const expKey = `${p.id}-${category}`;
                if (!stats[month][rowKey].addedExpected.has(expKey)) {
                  const expHrs = EXPECTED_HOURS[category]?.[p.buildingType] || 0;
                  stats[month][rowKey].expectedHours += expHrs;
                  stats[month][rowKey].addedExpected.add(expKey);
                }
              }
            }
          });
        });

        const sortedMonths = Array.from(allMonths).sort();
        let rowKeys = Array.from(rowKeysSet);

        const predefinedOrder = ['Pre-Design', 'Wall Panels', 'Floor Cassette', 'Roof Panels', 'Lookouts', 'Variation', 'Update', 'Correction'];

        rowKeys.sort((a, b) => {
          if (reportType === 'task-type') {
            let indexA = predefinedOrder.indexOf(a);
            let indexB = predefinedOrder.indexOf(b);
            if (indexA === -1) indexA = 999;
            if (indexB === -1) indexB = 999;
            if (indexA !== indexB) return indexA - indexB;
            return a.localeCompare(b);
          } else if (reportType === 'designer-task') {
            const partsA = a.split(' - ');
            const partsB = b.split(' - ');
            const designerA = partsA[0];
            const taskA = partsA[1] || '';
            const designerB = partsB[0];
            const taskB = partsB[1] || '';

            if (designerA !== designerB) return designerA.localeCompare(designerB);

            let indexA = predefinedOrder.indexOf(taskA);
            let indexB = predefinedOrder.indexOf(taskB);
            if (indexA === -1) indexA = 999;
            if (indexB === -1) indexB = 999;
            if (indexA !== indexB) return indexA - indexB;
            return taskA.localeCompare(taskB);
          } else {
            return a.localeCompare(b);
          }
        });

        sortedMonths.forEach(m => {
          rowKeys.forEach(rk => {
            if (!stats[m][rk]) stats[m][rk] = { count: 0, hours: 0, expectedHours: 0, addedExpected: new Set(), jobs: [] };
          });
        });

        return { stats, sortedMonths, rowKeys };
      }, [projects, buildingFilter, reportType, users]);

      const { stats, sortedMonths, rowKeys } = statsData;

      const formatMonth = (monthString) => {
        if (!monthString) return '';
        const parts = monthString.split('-');
        if(parts.length === 2) {
            return `${parts[1]}/${parts[0]}`;
        }
        return monthString;
      };

      const formatValue = (count, hours, expected, mode) => {
        if (count === 0) return '-';
        if (mode === 'count') return count;
        if (mode === 'total') return Number.isInteger(hours) ? hours : hours.toFixed(1);
        if (mode === 'average') {
            const avg = hours / count;
            return Number.isInteger(avg) ? avg : avg.toFixed(1);
        }
        if (mode === 'productivity') {
            if (!expected || expected === 0 || hours === 0) return '-'; // Bỏ qua nếu expected hoặc hours bằng 0
            const prod = (expected / hours) * 100; // Công thức: Expected / Thực tế
            return prod.toFixed(1) + '%';
        }
        return '-';
      };

      return (
        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 max-w-6xl mx-auto">
          <div className="flex flex-col xl:flex-row justify-between items-start xl:items-center gap-4 mb-6 border-b pb-4">
            <h3 className="text-lg font-extrabold text-slate-800 flex items-center gap-2">
              <BarChart2 className="w-5 h-5 text-indigo-500" />
              Completed Tasks Statistics
            </h3>
            
            <div className="flex flex-wrap items-center gap-3">
              <select 
                value={reportType}
                onChange={e => setReportType(e.target.value)}
                className="px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500 font-medium bg-white shadow-sm"
              >
                <option value="task-type">By Task Type</option>
                <option value="designer">By Designer</option>
                <option value="designer-task">By Designer & Task</option>
              </select>

              <select 
                value={buildingFilter}
                onChange={e => setBuildingFilter(e.target.value)}
                className="px-3 py-2 border border-slate-200 rounded-lg text-sm outline-none focus:ring-2 focus:ring-indigo-500 font-medium bg-white shadow-sm"
              >
                <option value="Overall">Overall</option>
                {BUILDING_TYPES.map(t => <option key={t} value={t}>{t}</option>)}
              </select>

              <div className="flex gap-1 bg-slate-100 p-1 rounded-xl border border-slate-200">
                <button 
                  onClick={() => setViewMode('count')}
                  className={`px-3 py-1.5 rounded-lg text-sm font-bold transition-all ${viewMode === 'count' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                >
                  Task Count
                </button>
                <button 
                  onClick={() => setViewMode('average')}
                  className={`px-3 py-1.5 rounded-lg text-sm font-bold transition-all ${viewMode === 'average' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                >
                  Average Hours
                </button>
                <button 
                  onClick={() => setViewMode('total')}
                  className={`px-3 py-1.5 rounded-lg text-sm font-bold transition-all ${viewMode === 'total' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                >
                  Total Hours
                </button>
                <button 
                  onClick={() => setViewMode('productivity')}
                  className={`px-3 py-1.5 rounded-lg text-sm font-bold transition-all ${viewMode === 'productivity' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
                >
                  Productivity (%)
                </button>
              </div>
            </div>
          </div>
          
          {sortedMonths.length === 0 ? (
             <p className="text-slate-500 text-center py-8">No completed tasks data available (requires Date Sent).</p>
          ) : (
            <ScrollableTableWrapper>
              <table className="w-full text-sm text-left border border-slate-200 rounded-lg overflow-hidden whitespace-nowrap">
                <thead className="text-[11px] text-slate-500 uppercase tracking-wider font-bold sticky top-0 z-30 shadow-sm">
                  <tr className="bg-slate-50">
                    <th className="px-5 py-4 border-r border-slate-200 bg-slate-50 sticky left-0 z-40 min-w-[200px]">
                      {reportType === 'task-type' ? 'Task Type' : reportType === 'designer' ? 'Designer' : 'Designer & Task'}
                    </th>
                    {sortedMonths.map(m => (
                      <th key={m} className="px-5 py-4 text-center border-r border-slate-200 bg-slate-50">{formatMonth(m)}</th>
                    ))}
                    <th className="px-5 py-4 text-center text-indigo-700 bg-indigo-50/90">Total</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-100">
                  {rowKeys.map(rk => {
                    let rowCount = 0;
                    let rowHours = 0;
                    let rowExpected = 0;
                    return (
                      <tr key={rk} className="hover:bg-slate-50 transition-colors">
                        <td className="px-5 py-3 font-bold text-slate-700 border-r border-slate-200 bg-white sticky left-0 z-10">{rk}</td>
                        {sortedMonths.map(m => {
                          const cellData = stats[m][rk];
                          rowCount += cellData.count;
                          rowHours += cellData.hours;
                          rowExpected += cellData.expectedHours;
                          
                          return (
                            <td 
                              key={m} 
                              className={`px-5 py-3 text-center border-r border-slate-200 font-medium ${cellData.count > 0 ? 'text-indigo-600 cursor-help hover:bg-indigo-50' : 'text-slate-600'}`}
                              title={cellData.jobs && cellData.jobs.length > 0 ? "Included Jobs:\n" + cellData.jobs.join('\n') : ''}
                            >
                              {formatValue(cellData.count, cellData.hours, cellData.expectedHours, viewMode)}
                            </td>
                          );
                        })}
                        <td className="px-5 py-3 text-center font-bold text-indigo-700 bg-indigo-50/30">
                          {formatValue(rowCount, rowHours, rowExpected, viewMode)}
                        </td>
                      </tr>
                    );
                  })}
                  
                  <tr className="bg-slate-100 font-extrabold text-slate-800 border-t-2 border-slate-200">
                    <td className="px-5 py-4 border-r border-slate-200 bg-slate-100 sticky left-0 z-10">MONTHLY TOTAL</td>
                    {sortedMonths.map(m => {
                      let colCount = 0;
                      let colHours = 0;
                      let colExpected = 0;
                      rowKeys.forEach(rk => {
                        colCount += stats[m][rk].count;
                        colHours += stats[m][rk].hours;
                        colExpected += stats[m][rk].expectedHours;
                      });
                      
                      return (
                        <td key={m} className="px-5 py-4 text-center border-r border-slate-200 text-indigo-700">
                          {formatValue(colCount, colHours, colExpected, viewMode)}
                        </td>
                      );
                    })}
                    <td className="px-5 py-4 text-center text-indigo-800 bg-indigo-100">
                      {(() => {
                        let grandCount = 0;
                        let grandHours = 0;
                        let grandExpected = 0;
                        rowKeys.forEach(rk => {
                          sortedMonths.forEach(m => {
                            grandCount += stats[m][rk].count;
                            grandHours += stats[m][rk].hours;
                            grandExpected += stats[m][rk].expectedHours;
                          });
                        });
                        return formatValue(grandCount, grandHours, grandExpected, viewMode);
                      })()}
                    </td>
                  </tr>
                </tbody>
              </table>
            </ScrollableTableWrapper>
          )}
        </div>
      );
    }

    function HistoryView({ historyLogs }) {
      const [timeFilter, setTimeFilter] = useState('today');

      const filteredLogs = useMemo(() => {
        const now = new Date();
        return historyLogs.filter(log => {
          if (timeFilter === 'all') return true;
          const logDate = new Date(log.timestamp);
          
          if (timeFilter === 'today') {
            return logDate.toDateString() === now.toDateString();
          }
          if (timeFilter === 'week') {
            const diffTime = Math.abs(now - logDate);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)); 
            return diffDays <= 7;
          }
          return true;
        });
      }, [historyLogs, timeFilter]);

      const formatDateTime = (isoString) => {
        const d = new Date(isoString);
        return d.toLocaleString('en-GB', { 
            day: '2-digit', month: '2-digit', year: 'numeric', 
            hour: '2-digit', minute: '2-digit'
        });
      };

      return (
        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 max-w-6xl mx-auto">
          <div className="flex justify-between items-center mb-6 border-b pb-4">
            <h3 className="text-lg font-extrabold text-slate-800 flex items-center gap-2">
              <Clock className="w-5 h-5 text-indigo-500" />
              Hours Entry History
            </h3>
            <div className="flex gap-2 bg-slate-100 p-1 rounded-xl border border-slate-200">
              <button 
                onClick={() => setTimeFilter('today')}
                className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${timeFilter === 'today' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
              >
                Today
              </button>
              <button 
                onClick={() => setTimeFilter('week')}
                className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${timeFilter === 'week' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
              >
                Last 7 Days
              </button>
              <button 
                onClick={() => setTimeFilter('all')}
                className={`px-4 py-2 rounded-lg text-sm font-bold transition-all ${timeFilter === 'all' ? 'bg-white text-indigo-700 shadow-sm' : 'text-slate-500 hover:text-slate-700'}`}
              >
                All Time
              </button>
            </div>
          </div>

          <ScrollableTableWrapper>
            <table className="w-full text-sm text-left">
              <thead className="text-[11px] font-bold text-slate-500 uppercase tracking-wider sticky top-0 z-30 shadow-sm">
                <tr className="bg-slate-50">
                  <th className="px-5 py-4 bg-slate-50">Time</th>
                  <th className="px-5 py-4 bg-slate-50">User</th>
                  <th className="px-5 py-4 bg-slate-50">Job Name</th>
                  <th className="px-5 py-4 bg-slate-50">Task Type</th>
                  <th className="px-5 py-4 text-center bg-slate-50">Old Hours</th>
                  <th className="px-5 py-4 text-center bg-slate-50">New Hours</th>
                  <th className="px-5 py-4 text-center bg-slate-50">Change</th>
                </tr>
              </thead>
              <tbody className="divide-y divide-slate-100">
                {filteredLogs.length === 0 ? (
                  <tr>
                    <td colSpan="7" className="px-5 py-8 text-center text-slate-400">
                      No history records found for this period. Try changing a Job's hours to see the logs.
                    </td>
                  </tr>
                ) : filteredLogs.map(log => {
                  const change = log.newHours - log.oldHours;
                  const isAdd = change > 0;
                  
                  return (
                    <tr key={log.id} className="hover:bg-slate-50 transition-colors bg-white">
                      <td className="px-5 py-3 text-slate-500 font-medium whitespace-nowrap">{formatDateTime(log.timestamp)}</td>
                      <td className="px-5 py-3 font-bold text-indigo-600">{log.userName}</td>
                      <td className="px-5 py-3 font-bold text-slate-700">{log.jobName}</td>
                      <td className="px-5 py-3">
                        <span className="bg-slate-100 px-2.5 py-1 rounded-md text-xs font-bold border border-slate-200 text-slate-600">
                          {log.phaseName}
                        </span>
                      </td>
                      <td className="px-5 py-3 text-center text-slate-400 font-medium line-through decoration-slate-300">{log.oldHours}</td>
                      <td className="px-5 py-3 text-center font-bold text-slate-800">{log.newHours}</td>
                      <td className="px-5 py-3 text-center">
                        <span className={`px-2.5 py-1 rounded-md text-xs font-bold ${isAdd ? 'bg-emerald-100 text-emerald-700' : 'bg-rose-100 text-rose-700'}`}>
                          {isAdd ? '+' : ''}{change % 1 === 0 ? change : change.toFixed(1)}
                        </span>
                      </td>
                    </tr>
                  )
                })}
              </tbody>
            </table>
          </ScrollableTableWrapper>
        </div>
      );
    }

    function ProgressView({ projects }) {
      const displayPhases = ['Pre-Design', 'DFM - Wall Panels', 'DFM - Floor Cassette', 'DFM - Roof Panels', 'DFM - Lookouts'];
      const normalize = str => str.replace(/[^a-zA-Z0-9]/g, '').toLowerCase();

      const getCellStatus = (project, basePhaseName) => {
        const activeUpdate = Object.entries(project.phases || {}).find(([name, data]) => {
           const normPhase = normalize(name);
           const normBase = normalize(basePhaseName);
           return normPhase.includes('update') && normPhase.includes(normBase) &&
                  ['In Progress', 'Checking', 'On Hold'].includes(data.progress);
        });

        if (activeUpdate) {
          if (activeUpdate[1].progress === 'On Hold') return 'Update On Hold';
          return 'Updating';
        }
        return project.phases?.[basePhaseName]?.progress || 'Not Started';
      };

      const getStatusStyle = (status) => {
        switch(status) {
          case 'Completed': return 'bg-emerald-100 text-emerald-700 border-emerald-200';
          case 'In Progress': return 'bg-blue-100 text-blue-700 border-blue-200';
          case 'Updating': return 'bg-purple-100 text-purple-700 border-purple-200';
          case 'Checking': return 'bg-orange-100 text-orange-700 border-orange-200';
          case 'On Hold': 
          case 'Update On Hold': return 'bg-red-100 text-red-700 border-red-200';
          case 'Not Started': return 'bg-slate-100 text-slate-400 border-slate-200';
          default: return 'bg-slate-100 text-slate-400 border-slate-200';
        }
      };

      // Sort by Site Name then Job Name
      const sortedProjects = [...projects].sort((a, b) => {
         const siteA = a.siteName || '';
         const siteB = b.siteName || '';
         if (siteA < siteB) return -1;
         if (siteA > siteB) return 1;
         const jobA = a.jobName || '';
         const jobB = b.jobName || '';
         if (jobA < jobB) return -1;
         if (jobA > jobB) return 1;
         return 0;
      });

      return (
        <div className="bg-white p-8 rounded-2xl shadow-sm border border-slate-200 max-w-6xl mx-auto">
          <div className="flex justify-between items-center mb-6 border-b pb-4">
            <h3 className="text-lg font-extrabold text-slate-800 flex items-center gap-2">
              <Activity className="w-5 h-5 text-indigo-500" />
              Project Progress

          <ScrollableTableWrapper>
            <table className="w-full text-sm text-left whitespace-nowrap">
              <thead className="text-[11px] font-bold text-slate-500 uppercase tracking-wider sticky top-0 z-30 shadow-sm">
                <tr className="bg-slate-50">
                  <th className="px-5 py-4 border-r border-slate-200 bg-slate-50 sticky left-0 z-40 w-40 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">Site Name</th>
                  <th className="px-5 py-4 border-r border-slate-200 bg-slate-50">Job Name</th>

    function StaffDashboard({ currentUser, projects, users, onJobClick }) {
      const myProjects = projects.filter(p => p.ownerId === currentUser.id);

      return (
        <div className="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
          <div className="p-6 border-b border-slate-100 bg-gradient-to-r from-slate-50 to-white">
            <h2 className="text-xl font-extrabold text-slate-800 flex items-center gap-2">
              <FileText className="w-6 h-6 text-indigo-600" />
              My Assigned Jobs
            </h2>
            <p className="text-sm text-slate-500 mt-1">Click on any job row to update phase progress and hours.</p>
          </div>
          <div className="p-6 bg-slate-50/30">
            <JobsTable projects={myProjects} users={users} onJobClick={onJobClick} />
          </div>
        </div>
      );
